<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팩맨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .game-container {
            text-align: center;
            max-width: 700px;
            width: 100%;
        }
        h1 { margin-bottom: 10px; }
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: #000;
            border: 4px solid #333;
        }
        .info {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 16px;
        }
        .info span { flex: 1; }
        .hint {
            margin-top: 10px;
            font-size: 14px;
            color: #ccc;
        }
        button {
            margin-top: 12px;
            padding: 10px 20px;
            border: none;
            background: #ffcc00;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover { background: #ffd94d; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>팩맨</h1>
        <canvas id="gameCanvas" width="560" height="620"></canvas>
        <div class="info">
            <span>점수: <strong id="score">0</strong></span>
            <span>남은 도트: <strong id="dotsLeft">0</strong></span>
            <span>목표: 도트를 모두 먹고 생존하기</span>
        </div>
        <div class="hint">화살표 키로 이동합니다. 벽에 닿으면 멈춥니다.</div>
        <button id="restartBtn">다시 시작</button>
    </div>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const dotsLeftEl = document.getElementById("dotsLeft");
        const restartBtn = document.getElementById("restartBtn");

        const TILE = 20;
        const ROWS = 31;
        const COLS = 28;
        const map = [
            "############################",
            "#............##............#",
            "#.####.#####.##.#####.####.#",
            "#o####.#####.##.#####.####o#",
            "#.####.#####.##.#####.####.#",
            "#..........................#",
            "#.####.##.########.##.####.#",
            "#.####.##.########.##.####.#",
            "#......##....##....##......#",
            "######.##### ## #####.######",
            "     #.##### ## #####.#     ",
            "     #.##          ##.#     ",
            "     #.## ###--### ##.#     ",
            "######.## #      # ##.######",
            "      .   #      #   .      ",
            "######.## #      # ##.######",
            "     #.## ######## ##.#     ",
            "     #.##          ##.#     ",
            "     #.## ######## ##.#     ",
            "######.## ######## ##.######",
            "#............##............#",
            "#.####.#####.##.#####.####.#",
            "#.####.#####.##.#####.####.#",
            "#o..##................##..o#",
            "###.##.##.########.##.##.###",
            "###.##.##.########.##.##.###",
            "#......##....##....##......#",
            "#.##########.##.##########.#",
            "#.##########.##.##########.#",
            "#..........................#",
            "############################"
        ];

        let board = [];
        let score = 0;
        let dotsLeft = 0;
        let gameOver = false;
        let pacman;
        let ghosts = [];
        let currentDirection = null;
        const directions = {
            ArrowUp: { x: 0, y: -1 },
            ArrowDown: { x: 0, y: 1 },
            ArrowLeft: { x: -1, y: 0 },
            ArrowRight: { x: 1, y: 0 }
        };

        function resetGame() {
            board = map.map(row => row.split(""));
            score = 0;
            dotsLeft = 0;
            gameOver = false;
            currentDirection = null;
            pacman = { x: 13, y: 23, dir: { x: 0, y: 0 }, radius: 8 };
            ghosts = [
                { x: 13, y: 11, color: "#ff4040", dir: { x: 1, y: 0 } },
                { x: 12, y: 14, color: "#00bfff", dir: { x: -1, y: 0 } },
                { x: 15, y: 14, color: "#ff66cc", dir: { x: 0, y: 1 } }
            ];
            board.forEach((row, y) => row.forEach((cell, x) => {
                if (cell === "." || cell === "o") dotsLeft++;
            }));
            updateHUD();
            draw();
        }

        function updateHUD() {
            scoreEl.textContent = score;
            dotsLeftEl.textContent = dotsLeft;
        }

        function isWall(x, y) {
            if (y < 0 || y >= ROWS || x < 0 || x >= COLS) return true;
            return board[y][x] === "#" || board[y][x] === " ";
        }

        function drawMaze() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = board[y][x];
                    const px = x * TILE;
                    const py = y * TILE;
                    if (cell === "#") {
                        ctx.fillStyle = "#0022aa";
                        ctx.fillRect(px, py, TILE, TILE);
                        ctx.fillStyle = "#001680";
                        ctx.fillRect(px + 4, py + 4, TILE - 8, TILE - 8);
                    } else if (cell === ".") {
                        ctx.fillStyle = "#ffde59";
                        ctx.beginPath();
                        ctx.arc(px + TILE/2, py + TILE/2, 3, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (cell === "o") {
                        ctx.fillStyle = "#ffe066";
                        ctx.beginPath();
                        ctx.arc(px + TILE/2, py + TILE/2, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }

        function drawPacman() {
            const x = pacman.x * TILE + TILE / 2;
            const y = pacman.y * TILE + TILE / 2;
            const angle = Math.atan2(pacman.dir.y, pacman.dir.x);
            ctx.fillStyle = "#ffcc00";
            ctx.beginPath();
            const start = angle - Math.PI / 4;
            const end = angle + Math.PI / 4;
            if (pacman.dir.x === 0 && pacman.dir.y === 0) {
                ctx.arc(x, y, pacman.radius, 0.25 * Math.PI, 1.75 * Math.PI);
                ctx.lineTo(x, y);
            } else {
                ctx.moveTo(x, y);
                ctx.arc(x, y, pacman.radius, start, end, false);
                ctx.lineTo(x, y);
            }
            ctx.fill();
        }

        function drawGhost(ghost) {
            const x = ghost.x * TILE + TILE / 2;
            const y = ghost.y * TILE + TILE / 2;
            ctx.fillStyle = ghost.color;
            ctx.beginPath();
            ctx.arc(x, y - 3, 8, Math.PI, 0);
            ctx.lineTo(x + 8, y + 6);
            ctx.quadraticCurveTo(x + 4, y + 2, x, y + 6);
            ctx.quadraticCurveTo(x - 4, y + 2, x - 8, y + 6);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(x - 4, y - 3, 3, 0, Math.PI * 2);
            ctx.arc(x + 4, y - 3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(x - 4, y - 3, 1.5, 0, Math.PI * 2);
            ctx.arc(x + 4, y - 3, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        function moveEntity(entity) {
            const nextX = entity.x + entity.dir.x;
            const nextY = entity.y + entity.dir.y;
            if (!isWall(nextX, nextY)) {
                entity.x = nextX;
                entity.y = nextY;
            }
        }

        function updatePacman() {
            if (!currentDirection) return;
            const nextX = pacman.x + currentDirection.x;
            const nextY = pacman.y + currentDirection.y;
            if (!isWall(nextX, nextY)) {
                pacman.dir = currentDirection;
                pacman.x = nextX;
                pacman.y = nextY;
            }
            const cell = board[pacman.y][pacman.x];
            if (cell === ".") {
                board[pacman.y][pacman.x] = " ";
                score += 10;
                dotsLeft -= 1;
            } else if (cell === "o") {
                board[pacman.y][pacman.x] = " ";
                score += 50;
                dotsLeft -= 1;
            }
        }

        function getPossibleGhostDirections(ghost) {
            const possible = [];
            for (const dir of Object.values(directions)) {
                const nextX = ghost.x + dir.x;
                const nextY = ghost.y + dir.y;
                if (!isWall(nextX, nextY)) possible.push(dir);
            }
            return possible;
        }

        function updateGhosts() {
            ghosts.forEach(ghost => {
                const choices = getPossibleGhostDirections(ghost);
                if (choices.length === 0) return;
                const targetX = pacman.x - ghost.x;
                const targetY = pacman.y - ghost.y;
                choices.sort((a, b) => {
                    const distA = Math.hypot(targetX - a.x, targetY - a.y);
                    const distB = Math.hypot(targetX - b.x, targetY - b.y);
                    return distA - distB;
                });
                ghost.dir = choices[0];
                moveEntity(ghost);
            });
        }

        function checkCollision() {
            for (const ghost of ghosts) {
                if (ghost.x === pacman.x && ghost.y === pacman.y) {
                    gameOver = true;
                    return;
                }
            }
        }

        function draw() {
            drawMaze();
            drawPacman();
            ghosts.forEach(drawGhost);
        }

        function gameLoop() {
            if (gameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffcc00";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("게임 종료! 다시 시작하세요.", canvas.width / 2, canvas.height / 2);
                return;
            }
            updatePacman();
            updateGhosts();
            checkCollision();
            updateHUD();
            draw();
            if (dotsLeft === 0) {
                gameOver = true;
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ff80";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("클리어! 잘했어요!", canvas.width / 2, canvas.height / 2);
                return;
            }
            setTimeout(gameLoop, 120);
        }

        window.addEventListener("keydown", event => {
            if (directions[event.key]) {
                currentDirection = directions[event.key];
                event.preventDefault();
            }
        });

        restartBtn.addEventListener("click", () => {
            resetGame();
            gameLoop();
        });

        resetGame();
        gameLoop();
    </script>
</body>
</html>
